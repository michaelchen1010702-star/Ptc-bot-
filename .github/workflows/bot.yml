name: PTC Bot

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many accounts to create"
        required: false
        default: "1"
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      COUNT: ${{ github.event.inputs.count || '1' }}
      DOMAIN_ORDER: auto
      HEADLESS: "0"
      SHEETS_URL: ${{ secrets.SHEETS_URL }}
      SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (optional, for captcha audio)
        run: brew install ffmpeg || true

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install chrome

      - name: Run bot
        run: python bot.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
