name: ptc bot

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'how many accounts'
        default: '1'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: diagnose bot.py
        if: always()
        run: |
          wc -l bot.py
          python3 -m py_compile bot.py && echo COMPILE_OK || echo COMPILE_FAILED

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: email probe
        run: python emailer.py

      - name: run bot
        env:
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: xvfb-run -a python bot.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-and-logs
          path: |
            accounts.csv
            debug/
          if-no-files-found: ignore
