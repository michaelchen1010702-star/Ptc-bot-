name: ptc bot

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'how many accounts'
        default: '1'
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ptc-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: diagnose bot.py
        if: always()
        run: |
          wc -l bot.py
          python3 -m py_compile bot.py && echo COMPILE_OK || echo COMPILE_FAILED

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: python deps
        run: pip install -r requirements.txt

      - name: playwright browsers
        run: python -m playwright install --with-deps chromium chrome

      - name: email probe
        continue-on-error: true
        run: python emailer.py

      - name: run bot
        timeout-minutes: 45
        env:
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          DOMAIN_ORDER: westcast-systems.com
        run: xvfb-run -a python bot.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-and-logs
          path: |
            accounts.csv
            debug/
          if-no-files-found: ignore
