name: ptc bot

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'how many accounts'
        default: '1'

permissions:
  contents: read

jobs:
  run:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SHEETS_URL: ${{ secrets.SHEETS_URL }}
      SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
      COUNT: ${{ github.event.inputs.count || '1' }}
      DOMAIN_ORDER: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: diagnose bot.py
        if: always()
        run: |
          wc -l bot.py
          python3 -m py_compile bot.py && echo COMPILE_OK || echo COMPILE_FAILED

      - name: system deps
        run: command -v ffmpeg >/dev/null || brew install ffmpeg || true

      - name: python deps
        run: pip install -r requirements.txt

      - name: playwright browsers
        run: python -m playwright install chromium chrome

      - name: email probe
        continue-on-error: true
        run: python emailer.py

      - name: run bot
        timeout-minutes: 45
        run: python bot.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            accounts.csv
            debug/
          if-no-files-found: ignore
